name: Android Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          ls -A "$ANDROID_HOME/cmdline-tools"
          CLT="$(ls -A "$ANDROID_HOME"/cmdline-tools | sort -V | tail -n1)"
          echo "$ANDROID_HOME/cmdline-tools/$CLT/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/$CLT/bin/sdkmanager" --version

      - name: Ensure Android NDK
        run: |
          ls -A "$ANDROID_HOME/ndk" || sdkmanager --install "ndk;27.3.13750724"
          NDK_HOME="$ANDROID_HOME/ndk/$(ls -A "$ANDROID_HOME/ndk" | sort -V | tail -n1)"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_HOME"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android armv7-linux-androideabi
          workspaces: src-tauri

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
            echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
            base64 -d <<< "$ANDROID_KEY_BASE64" > "$RUNNER_TEMP/keystore.jks"
            echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null
            echo "keyAlias=androiddebugkey" > keystore.properties
            echo "password=android" >> keystore.properties
            echo "storeFile=$RUNNER_TEMP/debug.keystore" >> keystore.properties
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK (arm64 + armv7)
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            pnpm tauri android build --apk --target aarch64 --target armv7 \
              -c "{\"version\":\"$VER\"}"
          else
            pnpm tauri android build --apk --target aarch64 --target armv7
          fi

      - name: Stage release artifacts
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          APP_ID="$(node -p "require('./package.json').name")"
          mkdir -p release-assets
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | while read -r apk; do
            variant="$(basename "$(dirname "$(dirname "$apk")")")"
            case "$variant" in
              universal) abi="universal" ;;
              arm64)     abi="arm64-v8a" ;;
              arm)       abi="armeabi-v7a" ;;
              x86)       abi="x86" ;;
              x86_64)    abi="x86_64" ;;
              *)         abi="$variant" ;;
            esac
            cp "$apk" "release-assets/${APP_ID}-${APP_VERSION}-${abi}.apk"
          done
          ls -la release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false || true
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md notes.md
          else
            cat > notes.md <<'EOF'
          > ⚠️ **测试版（Beta）** — 正式版发布前，所有构建均标记为测试版，可能存在稳定性或功能问题。

          ## 下载说明
          - `universal` APK 同时包含 arm64-v8a 与 armeabi-v7a 架构，适合大多数 Android 设备（Android 11+）
          - 侧载安装：允许"安装未知应用"后直接安装
          - 签名证书：CN=USB File Browser（所有测试版与正式版使用同一签名，可直接覆盖升级）
          EOF
          fi
          if [ "${{ contains(github.ref_name, '-') }}" = "true" ]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          gh release create "${{ github.ref_name }}" release-assets/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "USB文件浏览器 ${{ github.ref_name }}" \
            --notes-file notes.md \
            $PRERELEASE
